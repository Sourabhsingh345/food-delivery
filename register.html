<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="toast.js"></script>
</head>
<body>

<div class="login-container">

<h1>👤 Register</h1>

<input id="name" type="text" placeholder="Enter Name"><br><br>

<input id="email" type="email" placeholder="Enter Email"><br><br>

<input id="phone" type="text" placeholder="Enter Phone"><br><br>

<input id="password" type="password" placeholder="Enter Password"><br><br>

<button onclick="register()">Register</button>

<br><br>

<p>Already have an account?</p>

<a href="login.html">
<button type="button">Login</button>
</a>

</div>
<script>

const API="https://food-delivery-47zq.onrender.com";

async function register(){

const res=await fetch(`${API}/register`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:document.getElementById("name").value,

email:document.getElementById("email").value,

phone:document.getElementById("phone").value,

password:document.getElementById("password").value

})

});

const data=await res.json();

alert(data.message);

if(data.success){

window.location.href="login.html";

}

}

</script>

</body>
</html>
